spring.application.name=backend
server.port=${PORT:8080}

# Database (override via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wakedrive}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# File uploads (settings: logo + alarm sound)
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.base-url=${UPLOADS_BASE_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail (password reset)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Seed (first startup only; set these in production)
app.seed.super-admin-email=${SEED_ADMIN_EMAIL:superadmin@wakedrive.com}
app.seed.super-admin-password=${SEED_ADMIN_PASSWORD:SuperAdmin123!}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
