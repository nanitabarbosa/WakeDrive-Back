spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# Errores de la API: en local se incluye la excepción y su causa en "details"; en prod se desactiva
app.errors.expose-details=${EXPOSE_ERROR_DETAILS:true}

# Database. DB_PASSWORD es obligatoria: se define por variable de entorno, sin valor por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wakedrive}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
# none: el esquema lo manejan los scripts SQL. Usar create solo para recrear la base desde las entidades y luego correr src/main/resources/update.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.hibernate=WARN

# JWT. JWT_SECRET es obligatorio: se define por variable de entorno, sin valor por defecto.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# File uploads (settings: logo + alarm sound)
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.base-url=${UPLOADS_BASE_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# Mail (password reset)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Si se define BREVO_API_KEY el correo sale por la API HTTP de Brevo en vez de SMTP (Render Free bloquea SMTP)
app.mail.brevo-api-key=${BREVO_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Dispositivos: llave con la que se identifican (header X-Device-Key, DEVICE_API_KEY obligatoria, sin valor por defecto) y cuándo se consideran sin señal
app.device.api-key=${DEVICE_API_KEY}
app.device.offline-after-seconds=${DEVICE_OFFLINE_AFTER_SECONDS:120}
app.device.check-interval-ms=${DEVICE_CHECK_INTERVAL_MS:30000}

# Seed del super admin (solo en el primer arranque). Obligatorio: se define por variable de entorno, sin valor por defecto.
app.seed.super-admin-email=${SEED_ADMIN_EMAIL}
app.seed.super-admin-password=${SEED_ADMIN_PASSWORD}
