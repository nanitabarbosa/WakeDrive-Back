spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# Errores de la API: en local se incluye la excepción y su causa en "details"; en prod se desactiva
app.errors.expose-details=${EXPOSE_ERROR_DETAILS:true}

# Database (override via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wakedrive}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Migración automática del esquema antiguo (corre antes de Hibernate; idempotente)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/legacy-schema-migration.sql
spring.sql.init.separator=;;

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# File uploads (settings: logo + alarm sound)
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.base-url=${UPLOADS_BASE_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# Mail (password reset)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Seed (first startup only; set these in production)
app.seed.super-admin-email=${SEED_ADMIN_EMAIL:superadmin@wakedrive.com}
app.seed.super-admin-password=${SEED_ADMIN_PASSWORD:SuperAdmin123!}
