# Perfil de producción (se activa con SPRING_PROFILES_ACTIVE=prod, ver Dockerfile).
# Sin valores por defecto: si falta alguna variable, la aplicación no arranca en vez de usar un secreto conocido.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.seed.super-admin-password=${SEED_ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.jpa.show-sql=false
app.errors.expose-details=false
